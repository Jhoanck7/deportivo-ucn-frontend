<div class="login-container">
  <!-- Panel Izquierdo: Hero -->
  <div class="login-hero">
    <div class="hero-content">
      <span class="tag">Experiencia UCN</span>
      <h1 class="hero-title">
        Deportivo<br>UCN
      </h1>
      <p class="hero-description">
        Aquí encontrarás un espacio para desarrollarte, superarte y disfrutar el deporte junto a una gran comunidad.
      </p>
    </div>
  </div>

  <!-- Panel Derecho: Formulario de Inicio de Sesión -->
  <div class="login-form-container">
    <div class="login-form">
      <h2 class="form-header">¡Bienvenido!</h2>
      <p class="form-subtitle">Inicia sesión con alguna de las opciones disponibles</p>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <!-- Selector de Rol (Segmented Control) -->
        <div class="role-selector">
          <button 
            type="button" 
            class="role-btn" 
            [class.active]="selectedRole === 'user'" 
            (click)="selectedRole = 'user'"
          >
            Socio / Usuario
          </button>
          <button 
            type="button" 
            class="role-btn" 
            [class.active]="selectedRole === 'admin'" 
            (click)="selectedRole = 'admin'"
          >
            Administrador
          </button>
        </div>

        <!-- Campo: Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="email" 
              placeholder="name@example.com" 
              required
              email
              #emailInput="ngModel"
              [class.invalid]="emailInput.invalid && emailInput.touched"
            >
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              name="password" 
              [(ngModel)]="password" 
              placeholder="••••••••" 
              required
              #passwordInput="ngModel"
              [class.invalid]="passwordInput.invalid && passwordInput.touched"
            >
            <button 
              type="button" 
              class="password-toggle" 
              (click)="togglePasswordVisibility()"
              aria-label="Mostrar/Ocultar contraseña"
            >
              @if (showPassword) {
                <!-- Icono Ojo Cerrado (Ocultar) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              } @else {
                <!-- Icono Ojo Abierto (Mostrar) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
            </button>
          </div>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button 
          type="submit" 
          class="btn-login"
          [disabled]="form.invalid"
        >
          Iniciar Sesión
        </button>
      </form>

      <!-- Divisor -->
      <div class="divider">
        Prefiere también
      </div>

      <!-- Botón de Google -->
      <button 
        type="button" 
        class="btn-google" 
        (click)="loginWithGoogle()"
      >
        <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.938 5.48 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.32 0 2.505.454 3.436 1.346l2.582-2.581C13.463.896 11.426 0 9 0 5.48 0 2.438 2.062.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Ingresa con Google
      </button>
    </div>
  </div>
</div>
