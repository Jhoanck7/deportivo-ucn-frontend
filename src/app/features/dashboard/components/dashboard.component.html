<main class="contenedor-principal">
  <div class="header-container">
    <h1 class="titulo">Panel Deportivo UCN</h1>
    <button class="btn-logout" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Cerrar Sesión
    </button>
  </div>
  
  <div class="caja-conexion">
    <h2>Estado de la conexión con el Backend:</h2>
    
    @if (backendMessage) {
      <p class="mensaje-exito">
        {{ backendMessage }}
      </p>
    } @else {
      <p class="mensaje-espera">Intentando conectar con .NET 10...</p>
    }
  </div>

  <div class="dashboard-content">
    <div class="welcome-card">
      <h3>¡Has iniciado sesión correctamente!</h3>
      <p>Este es el panel principal de administración de tu proyecto integrador deportivo.</p>
    </div>
  </div>
</main>
