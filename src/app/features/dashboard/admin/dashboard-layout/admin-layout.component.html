<div class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="m2 22 1-1c3.4-3.4 6.8-6.8 10.2-10.2"></path><path d="M12 2a10 10 0 1 0 10 10"></path><path d="m14 14 3-3"></path><path d="m17 17 3-3"></path></svg>
        <h1>Deportes UCN</h1>
      </div>
      <span class="brand-subtitle">ADMINISTRADOR</span>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/dashboard-admin/overview" routerLinkActive="active">Panel Principal</a>
        </li>
        <li>
          <a routerLink="/dashboard-admin/roster" routerLinkActive="active">Nóminas</a>
        </li>
        <li>
          <a routerLink="/dashboard-admin/sport-branches" routerLinkActive="active">Ramas Deportivas</a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-primary" (click)="addNewReservation()">Nueva Reserva</button>
      <div class="footer-links">
        <a class="footer-link-item logout-link" (click)="logout()" style="cursor: pointer;">Cerrar Sesión</a>
      </div>
    </div>
  </aside>

  <div class="main-layout">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <div class="topbar-right">
        <button class="btn btn-whatsapp" (click)="onSupportClick()">WhatsApp Soporte</button>
      </div>
    </header>

    <main class="content-viewport">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
